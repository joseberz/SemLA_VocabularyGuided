[project]
name = "semla"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cityscapesscripts>=2.2.4",
    "einops>=0.8.1",
    "ftfy>=6.3.1",
    "imageio>=2.34.0",
    "numpy>=1.26.4",
    "open-clip-torch>=2.31.0",
    "opencv-python>=4.9.0.80",
    "peft>=0.10.0",
    "pillow>=10.2.0",
    "regex>=2024.11.6",
    "scipy>=1.12.0",
    "setuptools>=65.5.0",
    "timm>=1.0.15",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "wandb>=0.16.5",
]

[tool.uv.extra-build-dependencies]
detectron2 = ["torch"]

[tool.uv.sources]
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
no-build-isolation-package = ["detectron2"]
# Ensure that the setuptools v60.0.0 is used whenever a package has a build dependency
# on setuptools.
build-constraint-dependencies = ["setuptools==60.0.0"]
